[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "op-show"
version = "0.1.0"
description = "Hardware-free visual walkthroughs for tiled GPU operators"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
op-show = "op_show.cli:main"

[tool.setuptools]
packages = ["op_show", "op_show.web"]

[tool.setuptools.package-data]
"op_show.web" = ["*.html", "*.css", "*.js"]
